<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The AI Pilot Value Bridge</title>
  <desc id="desc">Diagram showing gross task benefit reduced by review, rework, exceptions, handoffs, tool cost, and risk to reach net downstream value.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#E05A47"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FBFAF7"/>
  <text x="80" y="86" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0F1C3F">The AI Pilot Value Bridge</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="20" fill="#586174">Measure what happens after the output, not just how fast it appears.</text>

  <g transform="translate(80 224)">
    <rect width="220" height="144" rx="14" fill="#0F1C3F"/>
    <text x="110" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">AI-assisted</text>
    <text x="110" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">task</text>
    <text x="110" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#BFC7D6">The step that gets faster</text>
  </g>

  <path d="M300 296H344" stroke="#E05A47" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(360 198)">
    <rect width="240" height="196" rx="14" fill="#00CC88"/>
    <text x="120" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1C3F">Gross task</text>
    <text x="120" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1C3F">benefit</text>
    <text x="120" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0F1C3F">Speed, volume, and queue</text>
  </g>

  <path d="M600 296H644" stroke="#E05A47" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(660 158)">
    <rect width="310" height="276" rx="14" fill="#F1EEE8" stroke="#D8D3C9" stroke-width="2"/>
    <text x="155" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1C3F">Subtract the hidden work</text>
    <line x1="28" y1="72" x2="282" y2="72" stroke="#D8D3C9"/>
    <text x="32" y="108" font-family="Arial, sans-serif" font-size="16" fill="#586174">− review time</text>
    <text x="32" y="142" font-family="Arial, sans-serif" font-size="16" fill="#586174">− correction and rework</text>
    <text x="32" y="176" font-family="Arial, sans-serif" font-size="16" fill="#586174">− exceptions and handoffs</text>
    <text x="32" y="210" font-family="Arial, sans-serif" font-size="16" fill="#586174">− tool and maintenance cost</text>
    <text x="32" y="244" font-family="Arial, sans-serif" font-size="16" fill="#586174">− risk and remediation</text>
  </g>

  <path d="M970 296H1014" stroke="#E05A47" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(1030 198)">
    <rect width="170" height="196" rx="14" fill="#E05A47"/>
    <text x="85" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Net</text>
    <text x="85" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">downstream</text>
    <text x="85" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">value</text>
    <text x="85" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#FFE5DF">What the business receives</text>
  </g>

  <line x1="80" y1="570" x2="1200" y2="570" stroke="#D8D3C9"/>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="16" fill="#586174">Proposed operating model, not a universal ROI formula.</text>
</svg>
