<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">The AI Pilot Value Bridge</title>
  <desc id="desc">Diagram showing gross task benefit reduced by review, rework, exceptions, handoffs, tool cost, and risk to reach net downstream value.</desc>
  <rect width="1200" height="640" fill="#fbfaf7"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f1c3f">The AI Pilot Value Bridge</text>
  <text x="70" y="122" font-family="Arial, sans-serif" font-size="20" fill="#586174">Measure what happens after the output, not just how fast it appears.</text>
  <rect x="70" y="245" width="220" height="130" rx="16" fill="#0f1c3f"/>
  <text x="180" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">AI-assisted</text>
  <text x="180" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">task</text>
  <path d="M290 310 H360" stroke="#e05a47" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="360" y="220" width="220" height="180" rx="16" fill="#00cc88"/>
  <text x="470" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f1c3f">Gross task</text>
  <text x="470" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f1c3f">benefit</text>
  <text x="470" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f1c3f">speed · volume · queue</text>
  <path d="M580 310 H650" stroke="#e05a47" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="650" y="170" width="260" height="280" rx="16" fill="#f1eee8" stroke="#d8d3c9" stroke-width="2"/>
  <text x="780" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f1c3f">Work counted</text>
  <text x="690" y="260" font-family="Arial, sans-serif" font-size="17" fill="#586174">− review time</text>
  <text x="690" y="295" font-family="Arial, sans-serif" font-size="17" fill="#586174">− correction and rework</text>
  <text x="690" y="330" font-family="Arial, sans-serif" font-size="17" fill="#586174">− exceptions and handoffs</text>
  <text x="690" y="365" font-family="Arial, sans-serif" font-size="17" fill="#586174">− tool and maintenance cost</text>
  <text x="690" y="400" font-family="Arial, sans-serif" font-size="17" fill="#586174">− risk and remediation</text>
  <path d="M910 310 H980" stroke="#e05a47" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="980" y="220" width="160" height="180" rx="16" fill="#e05a47"/>
  <text x="1060" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">Net</text>
  <text x="1060" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">downstream</text>
  <text x="1060" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">value</text>
  <text x="600" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586174">Proposed operating model, not a universal ROI formula</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e05a47"/></marker></defs>
</svg>
Я