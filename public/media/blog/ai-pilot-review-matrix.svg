<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Consequence and reversibility review matrix</title>
  <desc id="desc">Proposed review matrix matching consequence and reversibility to sampling, named approval, qualified owner review, or no autonomous action.</desc>
  <rect width="1180" height="760" fill="#FBFAF7"/>
  <text x="78" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0F1C3F">Review follows consequence and reversibility</text>
  <text x="78" y="122" font-family="Arial, sans-serif" font-size="19" fill="#586174">Proposed operating model, not a legal classification.</text>

  <text x="690" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1C3F">How difficult is the action to reverse?</text>
  <text x="420" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586174">Easy to reverse</text>
  <text x="900" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586174">Difficult to reverse</text>
  <text x="52" y="464" text-anchor="middle" transform="rotate(-90 52 464)" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1C3F">Consequence of error</text>
  <text x="120" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586174">Low</text>
  <text x="120" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586174">Moderate</text>
  <text x="120" y="586" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586174">High</text>

  <g transform="translate(180 244)">
    <rect width="380" height="112" rx="12" fill="#D9F7ED" stroke="#00CC88" stroke-width="2"/>
    <text x="190" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1C3F">Sample or spot-check</text>
    <text x="190" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Easy rollback</text>
  </g>
  <g transform="translate(580 244)">
    <rect width="420" height="112" rx="12" fill="#FFF1CF" stroke="#C9A84C" stroke-width="2"/>
    <text x="210" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1C3F">Named review</text>
    <text x="210" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Before release</text>
  </g>
  <g transform="translate(180 384)">
    <rect width="380" height="112" rx="12" fill="#FFF1CF" stroke="#C9A84C" stroke-width="2"/>
    <text x="190" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1C3F">Targeted approval</text>
    <text x="190" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Capture corrections</text>
  </g>
  <g transform="translate(580 384)">
    <rect width="420" height="112" rx="12" fill="#FFE0DB" stroke="#E05A47" stroke-width="2"/>
    <text x="210" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1C3F">Qualified owner approval</text>
    <text x="210" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Evidence and rollback</text>
  </g>
  <g transform="translate(180 524)">
    <rect width="820" height="112" rx="12" fill="#FFE0DB" stroke="#E05A47" stroke-width="2"/>
    <text x="410" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1C3F">No autonomous action</text>
    <text x="410" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Human decision owner and explicit approval</text>
  </g>

  <line x1="78" y1="686" x2="1000" y2="686" stroke="#D8D3C9"/>
  <text x="78" y="720" font-family="Arial, sans-serif" font-size="15" fill="#586174">Thresholds require local workflow validation.</text>
</svg>
