<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Consequence and reversibility review matrix</title>
  <desc id="desc">Proposed review matrix matching consequence and reversibility to sampling, named approval, qualified owner review, or no autonomous action.</desc>
  <rect width="1100" height="700" fill="#fbfaf7"/>
  <text x="70" y="74" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f1c3f">Review follows consequence and reversibility</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#586174">Proposed operating model, not a legal classification.</text>
  <text x="555" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f1c3f">How difficult is the action to reverse?</text>
  <text x="410" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586174">Easy to reverse</text>
  <text x="775" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586174">Difficult to reverse</text>
  <text x="46" y="440" text-anchor="middle" transform="rotate(-90 46 440)" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f1c3f">Consequence of error</text>
  <text x="116" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586174">Low</text>
  <text x="116" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586174">Moderate</text>
  <text x="116" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#586174">High</text>
  <rect x="170" y="235" width="330" height="110" rx="12" fill="#d9f7ed" stroke="#00cc88" stroke-width="2"/>
  <text x="335" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f1c3f">Sample or spot-check</text>
  <text x="335" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Easy rollback</text>
  <rect x="510" y="235" width="330" height="110" rx="12" fill="#fff1cf" stroke="#c9a84c" stroke-width="2"/>
  <text x="675" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f1c3f">Named review</text>
  <text x="675" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Before release</text>
  <rect x="170" y="365" width="330" height="110" rx="12" fill="#fff1cf" stroke="#c9a84c" stroke-width="2"/>
  <text x="335" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f1c3f">Targeted approval</text>
  <text x="335" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Capture corrections</text>
  <rect x="510" y="365" width="330" height="110" rx="12" fill="#ffe0db" stroke="#e05a47" stroke-width="2"/>
  <text x="675" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f1c3f">Qualified owner approval</text>
  <text x="675" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Evidence and rollback</text>
  <rect x="170" y="495" width="670" height="110" rx="12" fill="#ffe0db" stroke="#e05a47" stroke-width="2"/>
  <text x="505" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f1c3f">No autonomous action</text>
  <text x="505" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Human decision owner and explicit approval</text>
  <text x="550" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#586174">Thresholds require local workflow validation.</text>
</svg>
